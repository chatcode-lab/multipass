name: Official source health

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check official portal reachability and identity markers
        run: npm run --silent evidence:source-health -- --fail-on-regression | tee source-health-report.json
      - name: Preserve machine-readable source report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: official-source-health-${{ github.run_id }}
          path: source-health-report.json
          retention-days: 30
